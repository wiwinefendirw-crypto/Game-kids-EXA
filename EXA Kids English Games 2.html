hd=(b,mid,r)=>`<header><button class="bk" onclick="${b}">←</button><div class="pill">${mid}</div><div class="pill">${r}</div></header>`;
function rain(){for(let i=0;i<24;i++){const s=document.createElement('span');s.className='fl';s.textContent=['⭐','🎉','🌟','🎈'][i%4];s.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*1.5}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
function home(){clr();S={};$('app').innerHTML=`<header><h1>🐧 EXA Kids English</h1><div class="pill">⭐ ${tot()}</div></header><p class="sub">Pilih pertemuan, lalu pilih game. Ayo kumpulkan bintang!</p><div class="nm">👤 <input id="nm" placeholder="Tulis namamu" value="${esc(getN())}" onchange="setN(this.value)" maxlength="30"></div><div class="grid">${Object.values(M).map(m=>`<button class="mc" onclick="menu(${m.n})"><span class="ic">${m.r?(m.r=='all'?'🏆':'⭐'):m.it[0].e}</span><b>${m.n}</b><small>${m.t}</small><i>${'⭐'.repeat(ST[m.n]||0)}</i></button>`).join('')}</div><a class="gl" href="#guru">👩‍🏫 Halaman guru</a>`}
function menu(n){clr();S={n};$('app').innerHTML=hd('home()','Meeting '+n,'⭐ '+(ST[n]||0))+`<h2 style="margin:6px 0 12px">${M[n].t}</h2><div class="games">${[['quiz','🎯','Quiz Kilat','Jawab cepat sebelum waktu habis!'],['listen','🎧','Dengar & Pilih','Dengarkan, lalu pilih gambarnya'],['match','🃏','Cari Pasangan','Cocokkan kata dan gambar'],['spell','🔤','Susun Huruf','Susun huruf menjadi kata'],['learn','📖','Belajar Dulu','Kartu kosakata + suara']].map(g=>`<button class="gm" onclick="play('${g[0]}',${n})"><span>${g[1]}</span><div><b>${g[2]}</b><small>${g[3]}</small></div></button>`).join('')}</div>`}
function play(mode,n){clr();S={n,mode,pool:pool(n)};({quiz:startQ,listen:startQ,match,spell,learn})[mode]()}
function learn(){$('app').innerHTML=hd(`menu(${S.n})`,'Belajar','🔊 tap')+`<div class="ln">${S.pool.map((x,i)=>`<button class="lc" onclick="say(S.pool[${i}].w)"><span>${x.e}</span><div><b>${x.w}</b><small>${x.s}</small></div><span class="sp">🔊</span><span class="sp" onclick="event.stopPropagation();say(S.pool[${i}].s)">💬</span></button>`).join('')}</div>`}
function startQ(){let a=[];while(a.length<10)a.push(...sh(S.pool));S.qs=a.slice(0,10);S.q=S.score=S.ok=S.st=0;S.wr=[];nextQ()}
function nextQ(){if(S.q>=S.qs.length){const r=S.ok/S.qs.length,st=r>=.9?3:r>=.6?2:1;ST[S.n]=Math.max(ST[S.n]||0,st);save();return fin(`${S.ok}/${S.qs.length} benar · ${S.score} poin`,st)}
const it=S.it=S.qs[S.q],L=S.mode=='listen',bl=!L&&S.q%2?blank(it):null,d=[...sh(S.pool),...sh(ALL)].filter((x,i,a)=>x.w!=it.w&&a.findIndex(y=>y.w==x.w)==i).slice(0,3),o=sh([it,...d]);
$('app').innerHTML=hd(`menu(${S.n})`,`Soal ${S.q+1}/${S.qs.length}`,'⭐ '+S.score)+`<div class="tb"><i id="tm"></i></div><div class="qa">${L?`<button class="big" onclick="say(S.it.w)">🔊</button><p>Dengarkan, lalu pilih gambarnya!</p>`:`<div class="em">${it.e}</div>${bl?`<p class="sent">${bl}</p><button class="sm" onclick="say(S.it.s.replace(new RegExp(S.it.w,'i'),'hmm'))">🔊 Dengar kalimat</button>`:'<p>Apa bahasa Inggrisnya? Tap 🔊 di tiap kata!</p>'}`}</div><div class="opts ${L?'ee':''}">${o.map(x=>`<button data-c="${x.w==it.w?1:0}" onclick="ans(this)">${L?x.e:`<span>${x.w}</span><span class="sp" onclick="event.stopPropagation();say('${x.w}')">🔊</span>`}</button>`).join('')}</div>`;
if(L)setTimeout(()=>say(it.w),300);S.lock=0;S.t0=Date.now();clearInterval(S.iv);S.iv=setInterval(()=>{const r=1-(Date.now()-S.t0)/20000;$('tm').style.width=Math.max(r,0)*100+'%';if(r<=0)ans(null)},100)}
function ans(b){if(S.lock)return;S.lock=1;clearInterval(S.iv);const ok=b&&b.dataset.c=='1',r=Math.max(0,1-(Date.now()-S.t0)/20000);
if(ok){S.ok++;S.st++;S.score+=500+Math.round(r*400)+Math.min(S.st,5)*50}else{S.st=0;S.wr.push(S.it.w)}beep(ok);
document.querySelectorAll('.opts button').forEach(x=>{if(x.dataset.c=='1')x.classList.add('ok');else x.classList.add('no')});say(S.it.s);setTimeout(()=>{S.q++;nextQ()},1900)}
function fin(msg,st){clr();S.msg=msg;send(st);$('app').innerHTML=`<div class="end"><div class="em">${['','🙂','😄','🏆'][st]}</div><h2>${['','Bagus!','Hebat!','Luar biasa!'][st]}</h2><div class="stars">${'⭐'.repeat(st)}</div><p>${msg}</p><p id="snd" class="sub"></p><button class="cta" onclick="play('${S.mode}',${S.n})">🔁 Main lagi</button><button class="cta2" onclick="menu(${S.n})">📋 Pilih game lain</button></div>`;rain();beep(1)}
function match(){const p=sh(S.pool).slice(0,6);S.cards=sh(p.flatMap(x=>[{k:x.w,t:x.w,w:1},{k:x.w,t:x.e}]));S.open=[];S.done=S.mv=0;S.np=p.length;drawM()}
function drawM(){$('app').innerHTML=hd(`menu(${S.n})`,'Cari Pasangan','Langkah '+S.mv)+`<div class="mg">${S.cards.map((c,i)=>`<button class="mcd ${c.f?'f':''} ${c.d?'d':''}" onclick="flip(${i})">${c.f||c.d?c.t:'❓'}</button>`).join('')}</div>`}
function flip(i){const c=S.cards[i];if(c.f||c.d||S.open.length>1)return;c.f=1;S.open.push(i);if(c.w)say(c.t);
if(S.open.length==2){S.mv++;const[a,b]=S.open.map(j=>S.cards[j]);if(a.k==b.k){a.d=b.d=1;a.f=b.f=0;S.done++;S.open=[];beep(1)}else{beep(0);setTimeout(()=>{a.f=b.f=0;S.open=[];drawM()},1000)}}
drawM();if(S.done==S.np)setTimeout(()=>{const st=S.mv<=S.np+3?3:S.mv<=S.np*2?2:1;ST[S.n]=Math.max(ST[S.n]||0,st);save();fin(`Selesai dalam ${S.mv} langkah`,st)},700)}
const lt=w=>w.toLowerCase().replace(/[^a-z]/g,'');
function spell(){let p=S.pool.filter(x=>lt(x.w).length<=9);if(p.length<3)p=S.pool;S.sp=sh(p).slice(0,8);S.q=S.ok=0;S.wr=[];nextS()}
function nextS(){if(S.q>=S.sp.length){const r=S.ok/S.sp.length,st=r>=.9?3:r>=.6?2:1;ST[S.n]=Math.max(ST[S.n]||0,st);save();return fin(`${S.ok}/${S.sp.length} benar tanpa salah`,st)}
const it=S.it=S.sp[S.q];S.ans=lt(it.w);S.cur=[];S.bad=0;S.tl=sh(S.ans.split('').map((c,i)=>({c,i})));S.lock=0;drawS()}
function drawS(sk){const it=S.it,bl=blank(it);$('app').innerHTML=hd(`menu(${S.n})`,`Kata ${S.q+1}/${S.sp.length}`,'⭐ '+S.ok)+`<div class="qa"><div class="em">${it.e}</div>${bl?`<p>${bl}</p>`:''}<p><small>${it.w.split(' ').map(x=>lt(x).length).join(' + ')} huruf</small></p><button class="sm" onclick="say(S.it.w)">🔊 Dengar</button></div><div class="qa ${sk?'shake':''}">${S.ans.split('').map((_,i)=>`<span class="sl">${S.cur[i]?S.cur[i].c:''}</span>`).join('')}</div><div class="tiles">${S.tl.map(t=>`<button class="tl" ${S.cur.includes(t)?'disabled':''} onclick="pk(${t.i})">${t.c}</button>`).join('')}<button class="tl" style="background:#ff8787" onclick="S.cur.pop();drawS()">⌫</button></div>`}
function pk(i){if(S.lock)return;S.cur.push(S.tl.find(x=>x.i==i));if(S.cur.length<S.ans.length){say(S.cur[S.cur.length-1].c);return drawS()}
if(S.cur.map(t=>t.c).join('')==S.ans){S.lock=1;if(!S.bad)S.ok++;beep(1);say(S.it.w);drawS();setTimeout(()=>{S.q++;nextS()},1300)}
else{S.bad=1;S.wr.push(S.it.w);S.lock=1;beep(0);drawS(1);setTimeout(()=>{S.cur=[];S.lock=0;drawS()},700)}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),getN=()=>{try{return localStorage.getItem('exaN')||''}catch(e){return''}},setN=v=>{try{localStorage.setItem('exaN',v.trim())}catch(e){}},MD={quiz:'Quiz',listen:'Dengar',match:'Pasangan',spell:'Huruf'},goHome=()=>{location.hash='';home()},route=()=>location.hash=='#guru'?dash():home();
async function send(st){const n=S.n,md=S.mode,msg=S.msg,wr=S.wr||[],nm=getN(),t=x=>{const e=$('snd');if(e)e.textContent=x};
if(!nm)return t('⚠️ Tulis namamu di halaman awal supaya nilai terkirim ke guru.');
try{const db=window.claude&&await claude.use('db'),us=window.claude&&await claude.use('user'),id=us&&await us.id();if(!db||!id)throw 0;
const ref=db.collection('results').doc(id),s=await ref.get(),d=s.exists?s.data():{},m=d.m||{},k=n+'_'+md,o=m[k]||{tries:0,wr:[]};
m[k]={st:Math.max(o.st||0,st),msg,at:Date.now(),tries:o.tries+1,wr:[...new Set([...(o.wr||[]),...wr])].slice(-15)};await ref.set({name:nm,m});t('✅ Hasil terkirim ke guru!')}
catch(x){t('Hasil belum terkirim ke guru. Minta orang tua kirim lewat WhatsApp:');const a=document.createElement('a');a.href='https://wa.me/?text='+encodeURIComponent(`${nm} · Meeting ${n} ${M[n].t} · ${MD[md]} · ${msg} · ${'⭐'.repeat(st)}`);a.target='_blank';a.textContent=' 📤 Kirim WhatsApp';const e=$('snd');if(e)e.appendChild(a)}}
async function dash(){clr();$('app').innerHTML=`<header><button class="bk" onclick="goHome()">←</button><h1>👩‍🏫 Dashboard Guru</h1></header><p class="sub" id="ds">Memuat…</p>`;
try{const us=window.claude&&await claude.use('user'),db=window.claude&&await claude.use('db');
if(!us||!db||!(await us.canEdit()))return $('ds').textContent='Halaman ini hanya untuk guru (pemilik halaman). Pastikan Anda sudah masuk ke akun Claude Anda.';
const tm=setTimeout(()=>{const e=$('ds');if(e)e.textContent='Belum ada data murid, atau koneksi lambat.'},10000);
db.collection('results').onSnapshot(sn=>{clearTimeout(tm);drawD(sn.docs.map(x=>x.data()).sort((a,b)=>String(a.name).localeCompare(String(b.name))))},()=>{$('ds').textContent='Gagal memuat data.'})}catch(e){$('ds').textContent='Dashboard belum bisa dibuka di sini.'}}
function drawD(R){S.R=R;const sel=$('mt')?+$('mt').value:1,all=R.flatMap(r=>Object.values(r.m||{})),wc={};all.forEach(x=>(x.wr||[]).forEach(w=>wc[w]=(wc[w]||0)+1));
const top=Object.entries(wc).sort((a,b)=>b[1]-a[1]).slice(0,10),dt=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'}),ks=r=>Object.entries(r.m||{});
$('app').innerHTML=`<header><button class="bk" onclick="goHome()">←</button><h1>👩‍🏫 Dashboard Guru</h1></header><div class="pill" style="display:inline-block;margin-bottom:10px">👦 ${R.length} murid · 🎮 ${all.reduce((a,x)=>a+x.tries,0)} latihan</div>
<h2>✅ Cek PR per pertemuan</h2><select id="mt" onchange="drawD(S.R)">${Object.values(M).map(m=>`<option value="${m.n}" ${m.n==sel?'selected':''}>Meeting ${m.n} · ${m.t}</option>`).join('')}</select>
${R.map(r=>{const x=ks(r).filter(([k])=>k.split('_')[0]==sel),b=Math.max(0,...x.map(a=>a[1].st));return`<div class="dr"><b>${esc(r.name||'?')}</b><span>${x.length?'✅ '+'⭐'.repeat(b)+' · '+x.map(a=>MD[a[0].split('_')[1]]+' '+esc(a[1].msg.split(' · ')[0])).join(', '):'❌ belum'}</span></div>`}).join('')||'<p class="sub">Belum ada data murid.</p>'}
<h2>🔁 Kata yang sering salah</h2><p>${top.map(([w,c])=>`<span class="pill">${esc(w)} ×${c}</span>`).join(' ')||'Belum ada data.'}</p>
<h2>📋 Riwayat murid</h2>${R.map(r=>`<details class="dr2"><summary><b>${esc(r.name||'?')}</b> · ${ks(r).length} game</summary>${ks(r).sort((a,b)=>b[1].at-a[1].at).map(([k,v])=>`<div class="lc2">Meeting ${k.split('_')[0]} · ${MD[k.split('_')[1]]} · ${'⭐'.repeat(v.st)} · ${esc(v.msg)} · ${v.tries}× · ${dt(v.at)}</div>`).join('')}</details>`).join('')}`}
window.onhashchange=route;route();
</script></body></html>
